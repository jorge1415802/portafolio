<div class="flex flex-row flex-wrap items-start justify-center gap-4">
	@for(project of projects(); track project.title){
	<hlm-card size="sm"
		class="mx-auto w-full max-w-sm min-h-96 rounded-2xl flex flex-nowrap justify-between border-purple-400 hover:border hover:border-purple-600 transition-colors duration-800 ease-in-out hover:shadow-[0_0_25px_-5px_rgba(56,189,248,0.4)]">
		<hlm-card-header>
			<h3 hlmCardTitle>{{project.title}}</h3>
			<h4 hlmCardSubtitle class="font-bold">Stack</h4>
			<h4 hlmCardSubtitle>Stack: {{project.stack}}</h4>
			
		</hlm-card-header>
		<div hlmCardContent
			class="max-h-48 space-y-4">
			<p hlmCardDescription>{{project.description}}</p>
		</div>
		<hlm-card-footer>
			<a href="{{project.link}}" target="_blank" hlmBtn size="sm"
				class="w-full rounded-md bg-cyan-700 hover:bg-cyan-900 text-foreground">
				{{project.go}}
			</a>
		</hlm-card-footer>
	</hlm-card>
	}

</div>
