<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">
	@for(project of projects(); track project.title){
	<hlm-card
		class="flex h-full w-full flex-col justify-between rounded-2xl border  border-sky-400/25 bg-slate-950/40 transition-all duration-300 hover:border-sky-400 hover:shadow-[0_0_25px_-5px_rgba(56,189,248,0.4)]">
		<hlm-card-header>
			<h3 hlmCardTitle class="text-base leading-snug sm:text-lg">{{project.title}}</h3>
			<h4 hlmCardSubtitle class="text-sm leading-relaxed wrap-break-word">{{project.stack}}</h4>
		</hlm-card-header>
		<div hlmCardContent class="space-y-4">
			<p hlmCardDescription class="text-sm leading-relaxed sm:text-base">{{project.description}}</p>
		</div>
		<hlm-card-footer>
			<a href="{{project.link}}" target="_blank" rel="noopener noreferrer" hlmBtn size="sm"
				class="w-full rounded-md bg-cyan-700 text-foreground hover:bg-cyan-900">
				{{project.go}}
			</a>
		</hlm-card-footer>
	</hlm-card>
	}
</div>
